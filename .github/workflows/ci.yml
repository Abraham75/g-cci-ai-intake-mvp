name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR commit
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"
      - name: Install Node dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build

  ontology-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR commit
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}"
      - name: Install ontology validators
        run: python3 -m pip install --upgrade pip rdflib pyshacl
      - name: Parse RDF/OWL and run SHACL validation
        run: python3 scripts/validate_ontology.py

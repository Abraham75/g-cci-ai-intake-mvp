name: CI

on:
  pull_request:
  push:
    branches: [main, feature/gcci-ontology-ledger-integration]

permissions:
  contents: read

concurrency:
  group: gcci-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Node dependencies
        run: npm install
      - name: TypeScript typecheck
        run: npm run build
      - name: Compile production server artifact
        run: npm run build:server

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm install
      - name: Build React dashboard
        working-directory: frontend-react
        run: npm run build

  ontology-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ontology validators
        run: python -m pip install --upgrade pip rdflib pyshacl
      - name: Parse RDF/OWL and run SHACL validation
        run: python scripts/validate_ontology.py

  python-correlation-service:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: gcci
          POSTGRES_USER: gcci
          POSTGRES_PASSWORD: gcci_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gcci -d gcci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GCCI_ENVIRONMENT: development
      GCCI_DATABASE_URL: postgresql+asyncpg://gcci:gcci_ci@localhost:5432/gcci
      GCCI_CANONICAL_SCORER_URL: http://localhost:3001/api/scoring/score
      GCCI_INTERNAL_SERVICE_TOKEN: gcci-ci-internal-service-token
      GCCI_CONTACT_VAULT_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GCCI_CONTACT_FINGERPRINT_KEY: gcci-ci-contact-fingerprint-key
      GCCI_CAMERA_MIN_EXPECTED_RECORDS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and compile canonical TypeScript scorer
        run: |
          npm install
          npm run build
          npm run build:server

      - name: Start authenticated compiled canonical scorer
        env:
          NODE_ENV: production
          GCCI_INTERNAL_SERVICE_TOKEN: gcci-ci-internal-service-token
        run: |
          nohup npm run start:server >/tmp/gcci-scorer.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gcci-scorer.log
          exit 1

      - name: Install Python correlation service
        working-directory: services/correlation-python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Python syntax compilation
        working-directory: services/correlation-python
        run: python -m compileall -q gcci tests

      - name: Apply tracked PostGIS migrations
        working-directory: services/correlation-python
        run: python -m gcci.migrate

      - name: Verify migration runner is idempotent
        working-directory: services/correlation-python
        run: python -m gcci.migrate

      - name: Ruff
        working-directory: services/correlation-python
        run: ruff check gcci tests

      - name: Pytest including PostGIS + canonical scorer integration
        working-directory: services/correlation-python
        run: pytest -q

      - name: Dump scorer logs on failure
        if: failure()
        run: cat /tmp/gcci-scorer.log || true

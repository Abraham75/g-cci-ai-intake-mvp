name: G-CCI CI

on:
  push:
    branches: [main, feature/react-gcci-dashboard]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend test dependencies
        run: python -m pip install fastapi uvicorn pydantic pytest httpx
      - name: Run backend tests
        run: pytest -q tests/test_consolidated_backend.py tests/test_modular_api_v1.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm install
      - name: Build frontend
        working-directory: frontend-react
        run: npm run build

name: CI

on:
  pull_request:
  push:
    branches: [main, feature/gcci-ontology-ledger-integration]

jobs:
  typescript-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        run: |
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "${REF}" "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: Install Node dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        run: |
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "${REF}" "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm install
      - name: Build React dashboard
        working-directory: frontend-react
        run: npm run build

  ontology-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        run: |
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "${REF}" "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: Install ontology validators
        run: python3 -m pip install --upgrade pip rdflib pyshacl
      - name: Parse RDF/OWL and run SHACL validation
        run: python3 scripts/validate_ontology.py

  python-correlation-service:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: gcci
          POSTGRES_USER: gcci
          POSTGRES_PASSWORD: gcci_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gcci -d gcci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GCCI_DATABASE_URL: postgresql+asyncpg://gcci:gcci_ci@localhost:5432/gcci
    defaults:
      run:
        working-directory: services/correlation-python
    steps:
      - name: Checkout source branch
        working-directory: .
        run: |
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "${REF}" "https://github.com/${GITHUB_REPOSITORY}.git" .
      - name: Install Python service
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"
      - name: Apply PostGIS schema
        env:
          PGPASSWORD: gcci_ci
        run: psql -h localhost -U gcci -d gcci -f migrations/001_postgis_persistence.sql
      - name: Ruff
        run: ruff check gcci tests
      - name: Pytest
        run: pytest -q
